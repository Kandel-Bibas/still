name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build
        run: bash scripts/build.sh
